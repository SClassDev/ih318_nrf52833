CONFIG_NCS_SAMPLES_DEFAULTS=y
CONFIG_HEAP_MEM_POOL_SIZE=2048

CONFIG_BT=y
CONFIG_BT_SMP=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="ihlu ih318"

# CONFIG_BT_DEVICE_APPEARANCE=833
CONFIG_BT_MAX_CONN=2
CONFIG_BT_MAX_PAIRED=2

# Enable the BT NUS shell
CONFIG_SHELL_BT_NUS=y
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_DUMMY=y


# Serial and console configuration
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# SEGGER RTT Treiber und RTT-Konsole aktivieren
# CONFIG_USE_SEGGER_RTT=y
# CONFIG_RTT_CONSOLE=y

# Optional: Zephyr Logger-System ebenfalls auf RTT umleiten
# CONFIG_LOG=y
# CONFIG_LOG_BACKEND_RTT=y
CONFIG_MPSL=y
CONFIG_MPSL_FEM=y
CONFIG_MPSL_FEM_NRF21540_GPIO_SPI=y
CONFIG_MPSL_FEM_POWER_MODEL=y
CONFIG_POWEROFF=y

# UART interrupt driver
CONFIG_NRF_SW_LPUART=y

# Uncomment to use lpuart using interrupt driven API
CONFIG_NRF_SW_LPUART_INT_DRIVEN=y

CONFIG_UART_1_ASYNC=y
CONFIG_UART_1_INTERRUPT_DRIVEN=n
CONFIG_UART_1_NRF_HW_ASYNC=y
CONFIG_UART_1_NRF_HW_ASYNC_TIMER=2
CONFIG_UART_1_NRF_ASYNC_LOW_POWER=y

CONFIG_NRF_SW_LPUART_INIT_PRIORITY=55

# Maximum Bluetooth LE ATT MTU
CONFIG_BT_L2CAP_TX_MTU=517
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_USER_DATA_LEN_UPDATE=y

# 1. Nutze den internen RC statt dem externen Quarz
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y

# 2. Zwingend erforderlich: Kalibrierung für den RC-Takt einschalten
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC_CALIBRATION=y

# 3. Dem BLE-Stack die 500 ppm Genauigkeit des RC-Oszillators mitteilen (vergrößert RX-Fenster für Verbindungen)
CONFIG_CLOCK_CONTROL_NRF_K32SRC_500PPM=y
CONFIG_BT_CTLR_SDC_MAX_CONN_EVENT_LEN_DEFAULT=0

# Apple iOS konforme Connection Parameter
# CONFIG_BT_GAP_PERIPHERAL_PREF_PARAMS=y
# CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=y

# Min Interval: 15 ms (12 * 1.25ms) - Apple verlangt min >= 15ms
# CONFIG_BT_PERIPHERAL_PREF_MIN_INT=12
# Max Interval: 30 ms (24 * 1.25ms) - Apple verlangt max >= min + 15ms
# CONFIG_BT_PERIPHERAL_PREF_MAX_INT=24
# CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
# Timeout: 400 * 10ms = 4000ms (Apple verlangt <= 6s und >= (1+latency)*max_int*3)
# CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

# 1. Enable Bonding and Security Manager Protocol (SMP)
#CONFIG_BT_SETTINGS=y
#CONFIG_BT_BONDABLE=y
#CONFIG_BT_SMP=y

# 2. MANDATORY for Android 13: Enable Flash Storage for Bonds
# Without these, keys aren't saved to NVS flash, causing immediate reconnection failure.
#CONFIG_FLASH=y
#CONFIG_FLASH_PAGE_LAYOUT=y
#CONFIG_FLASH_MAP=y
#CONFIG_NVS=y
#CONFIG_SETTINGS=y

# 3. Android 13 MTU & Data Length Extensions (DLE) Optimization
# Prevents timeout drops during the heavy key-exchange phase.
#CONFIG_BT_L2CAP_DYNAMIC_CHANNEL=y
#CONFIG_BT_BUF_ACL_RX_SIZE=251
#CONFIG_BT_BUF_ACL_TX_SIZE=251

# Erlaubt der App, Passkeys per Callback bereitzustellen (Ersetzt FIXED_PASSKEY)
#CONFIG_BT_APP_PASSKEY=y